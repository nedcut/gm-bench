name: Semgrep CE scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep/scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Publish scan results to the code-scanning dashboard.
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install "semgrep==1.170.0"
      - name: Fetch pinned Semgrep community ruleset
        env:
          SEMGREP_RULESET_URL: https://semgrep.dev/c/p/default
          SEMGREP_RULESET_SEMANTIC_SHA256: a3f79ad270db96e167bad3546f97a2e4169fbd1625ceb41e4bbbea54651ea1bf
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "$SEMGREP_RULESET_URL" --output semgrep-default.yml
          python scripts/prepare_semgrep_ruleset.py \
            --expected-semantic-sha256 "$SEMGREP_RULESET_SEMANTIC_SHA256" \
            semgrep-default.yml semgrep-base.yml
      - name: Run Semgrep
        run: >-
          semgrep scan --config semgrep-base.yml --config .semgrep.yml
          --no-rewrite-rule-ids
          --error --sarif --output=semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
