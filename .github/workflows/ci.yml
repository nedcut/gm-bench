name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and install clean wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/gm-bench-wheel
          python -m venv /tmp/gm-bench-wheel-venv
          /tmp/gm-bench-wheel-venv/bin/pip install --no-deps /tmp/gm-bench-wheel/*.whl
      - name: Smoke wheel outside the checkout
        working-directory: /tmp
        run: |
          /tmp/gm-bench-wheel-venv/bin/gm-bench --help >/dev/null
          /tmp/gm-bench-wheel-venv/bin/gm-bench run \
            --agent value --seeds 1 --seasons 1 --no-log --json \
            >/tmp/gm-bench-wheel-smoke.json
          /tmp/gm-bench-wheel-venv/bin/python - <<'PY'
          from pathlib import Path

          import gm_bench
          from gm_bench.contract import benchmark_contract, scaffold_fingerprint
          from gm_bench.providers import EXAMPLES, build_provider_agent

          package_root = Path(gm_bench.__file__).parent
          assert benchmark_contract()["contract_fingerprint"]
          assert scaffold_fingerprint("openai")
          assert build_provider_agent("openai").name.startswith("openai:")
          assert EXAMPLES == package_root / "_resources" / "examples"
          assert (package_root / "_resources" / "schemas" / "gm_actions.schema.json").is_file()
          assert not (package_root.parent / "examples").exists()
          assert not (package_root.parent / "schemas").exists()
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run validity canaries
        run: python -m gm_bench validate-contract
      - name: Validate committed leaderboard results
        run: |
          # Validate every artifact against the policy matching its own declared
          # benchmark_version, rather than assuming sota-v2. Hardcoding v2 here
          # would fail the first time a sota-v3 row is committed, and an unknown
          # version must fail loudly rather than skip validation silently.
          count=0
          while IFS= read -r -d '' result; do
            version="$(python - "$result" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          contract = (payload.get("run_info") or {}).get("benchmark_contract") or {}
          print(contract.get("benchmark_version") or "unknown")
          PY
          )"
            case "$version" in
              sota-v1|sota-v2|sota-v3) ;;
              *)
                echo "::error file=$result::unknown benchmark_version '$version'; no validation policy applies"
                exit 1
                ;;
            esac
            echo "validating $result against policy $version"
            python -m gm_bench validate-result "$result" --policy "$version"
            count=$((count + 1))
          done < <(find results/leaderboard -maxdepth 1 -type f -name '*.json' -print0)
          echo "validated $count current leaderboard result(s)"
      - name: Enforce compact publication artifacts
        run: |
          while IFS= read -r -d '' result; do
            python - "$result" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          payload = json.loads(path.read_text())
          publication = payload.get("publication") or {}
          assert publication.get("format") == "gm-bench-result-summary-v1", f"{path}: run compact-result before committing"
          assert publication.get("traces_included") is False, f"{path}: traces must not be committed"
          assert path.stat().st_size < 1_000_000, f"{path}: artifact exceeds 1 MB"
          for bucket in (payload.get("candidate"), *(payload.get("baselines") or [])):
              if not isinstance(bucket, dict):
                  continue
              for episode in bucket.get("episodes") or []:
                  assert "transactions" not in episode, f"{path}: episode traces must not be committed"
                  assert "season_summaries" not in episode, f"{path}: season summaries must not be committed"
                  usage = episode.get("usage")
                  if isinstance(usage, dict):
                      assert "per_decision" not in usage, f"{path}: per_decision usage must not be committed"
          PY
          done < <(find results/leaderboard -maxdepth 1 -type f -name '*.json' -print0)
      - name: Output-budget analysis is reproducible
        # Publishing keys off analysis.status; regenerate from the committed
        # sweep config (+ optional cell artifacts) and refuse hand-edited status.
        run: |
          mapfile -d '' cells < <(find results/analysis/output-budget-cells -type f -name '*.json' -print0 2>/dev/null || true)
          python scripts/analyze_output_budget.py "${cells[@]}" --output /tmp/output-budget-sweep.regen.json
          if ! diff -u results/analysis/output-budget-sweep.json /tmp/output-budget-sweep.regen.json; then
            echo "::error::results/analysis/output-budget-sweep.json is stale or hand-edited; re-run scripts/analyze_output_budget.py and commit the result"
            exit 1
          fi
      - name: Publication cost estimate is reproducible
        run: |
          python scripts/estimate_publication_cost.py --output /tmp/fixed-panel-cost.regen.json
          if ! diff -u results/analysis/output-budget-cost-estimate.json /tmp/fixed-panel-cost.regen.json; then
            echo "::error::results/analysis/output-budget-cost-estimate.json is stale; regenerate the fixed-panel estimate from the committed registry, lane, and pricing snapshot"
            exit 1
          fi
          python scripts/estimate_publication_cost.py \
            --models-config config/sota_v3_models.json \
            --lane-config config/sota_v3_lane.json \
            --pricing config/sota_v3_pricing_snapshot.json \
            --output /tmp/sota-v3-pre-smoke-cost.regen.json
          if ! diff -u results/analysis/sota-v3-pre-smoke-cost-estimate.json /tmp/sota-v3-pre-smoke-cost.regen.json; then
            echo "::error::results/analysis/sota-v3-pre-smoke-cost-estimate.json is stale; regenerate it from the committed v3 registry, lane, and pricing snapshot"
            exit 1
          fi
      - name: Verify archived v1 evidence
        # `archive-v1` asserts these are authentic v1 artifacts on the frozen
        # contract. It deliberately does NOT assert they were leaderboard-eligible
        # -- they are evidence of the v1 scout-contract break, not a ranking.
        run: |
          count=0
          while IFS= read -r -d '' result; do
            python -m gm_bench validate-result "$result" --policy archive-v1
            count=$((count + 1))
          done < <(find results/leaderboard/archive-v1 -maxdepth 1 -type f -name '*.json' -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no archived v1 evidence found; the archive must stay verifiable"
            exit 1
          fi
          echo "verified $count archived v1 artifact(s)"
      - name: Leaderboard site data is reproducible from committed artifacts
        # Guards against site data built from untracked local files: the committed
        # leaderboard.json must be exactly what the builder emits from this tree.
        run: |
          python web/scripts/build_leaderboard.py
          if ! git diff --exit-code -- web/src/data/leaderboard.json; then
            echo "::error::web/src/data/leaderboard.json is stale or was built from artifacts that are not committed; re-run python web/scripts/build_leaderboard.py and commit the result"
            exit 1
          fi
