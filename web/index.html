    <meta name="theme-color" content="#0c1522" />
    <script>
      // Apply a saved theme before first paint so a light-theme reader never sees a dark flash.
      try {
        var saved = localStorage.getItem("gm-bench-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="GM-Bench: a deterministic front-office benchmark for LLM agents. sota-v5 (contract a600b7da0c302231): 11 published models, every one trailing the strongest scripted heuristic on a 29-seed private panel, plus a separate decision-model lane."
    />
    <!-- Canonical metadata is not a fetched subresource, so SRI does not apply. -->
    <link rel="canonical" href="https://nedcut.github.io/gm-bench/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nedcut.github.io/gm-bench/" />
